[package]
name = "setlist"
version = "0.1.0"
description = "Curate, version & analyze your Spotify playlists"
authors = ["ulysses822"]
license = "GPL-3.0-only"
repository = "https://github.com/ulysses822/setlist"
edition = "2021"
# The graph's real floor, not a guess: darling, plist, serde_with and time all declare 1.88.
# Cargo refuses the build with a clear message below this, instead of failing inside a
# dependency on syntax the toolchain does not know.
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "setlist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Refuse a second running copy: two instances share one keychain refresh token and would
# rotate it out from under each other (Spotify's reuse detection then kills the session).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Spotify OAuth (PKCE) + API client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time"] }
# The real Windows Credential Manager backend. Without a backend feature keyring falls back to
# a non-persistent in-memory mock, so `spotify/auth.rs` refuses to build off Windows -- add
# `apple-native` or `sync-secret-service` here before dropping that guard.
keyring = { version = "3", features = ["windows-native"] }
tiny_http = "0.12"
base64 = "0.22"
sha2 = "0.11"
rand = "0.8"
urlencoding = "2"
open = "5"
# Native folder picker for choosing the data directory.
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
