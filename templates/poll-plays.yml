name: Poll recently played

# Logs your Spotify listening history into history/plays.jsonl without the desktop app
# needing to be open. Runs every 30 min; also runnable on demand.
on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (GitHub cron is best-effort; the 50-track buffer covers drift)
  workflow_dispatch: {}

# Prevent overlapping runs from racing on the same file.
concurrency:
  group: poll-plays
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA, not a mutable tag: a hijacked tag (cf. the tj-actions
      # compromise) must not be able to inject code into a job that holds the Spotify
      # secrets. Nothing updates this pin automatically; do it by hand.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # No setup-node and no npx: the poller is dependency-free plain Node ESM, run with the
      # runner's built-in Node 20. Nothing is fetched from npm in this secret-bearing job.
      - name: Append new plays
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node scripts/poll-plays.mjs

      - name: Commit history if changed
        run: |
          if [[ -z "$(git status --porcelain history/plays.jsonl)" ]]; then
            echo "No history changes."
            exit 0
          fi
          git config user.name "setlist-bot"
          git config user.email "setlist-bot@users.noreply.github.com"
          git add history/plays.jsonl
          git commit -m "chore(history): log recently played [skip ci]"

          # You push to this repo too -- Setlist's version-control panel commits playlists to
          # it -- so the remote can have moved on since this job checked out. A bare `git push`
          # would just fail, and a failed run isn't only a red X: recently-played goes back
          # 50 tracks, so enough missed runs become a permanent hole in the log. Rebase onto
          # whatever landed and try again. The concurrency group above already stops this job
          # racing itself, so the only writer to reconcile with is you.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt of 3) -- rebasing onto the remote."
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "::error::history/plays.jsonl on the remote will not rebase cleanly. The log is append-only, so this usually means it was hand-edited or rewritten. Resolve it in a checkout and re-run."
              exit 1
            fi
          done
          echo "::error::Still could not push after 3 attempts."
          exit 1
