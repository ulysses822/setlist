name: Feature request
description: Suggest something Setlist should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Setlist is a curation tool: it exists to help you decide what belongs in a playlist and
        then push that decision to Spotify. Ideas that sharpen that are the ones most likely to
        land. Playback, discovery and recommendation features are mostly Spotify's own job and
        are usually a no — worth checking that first so you don't write a long issue for nothing.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do that's awkward today?
      description: >
        The problem rather than the solution. What are you doing now instead, and where does it
        break down?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
      description: Rough is fine. If you have two ideas and can't choose, say both.
    validations:
      required: false

  - type: checkboxes
    id: platform
    attributes:
      label: Platform
      options:
        - label: >
            I understand Setlist is Windows-only, and this isn't a request to port it (that one
            needs its own issue — see CONTRIBUTING.md).
          required: true
